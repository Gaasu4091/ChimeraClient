plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = '1.0.0'
group = 'me.alpha432'
base { archivesName = 'chimeraclient' }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://jitpack.io' }
}

loom {
    accessWidenerPath = file('src/main/resources/chimeraclient.accesswidener')
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation("com.github.cattyngmd.catformat:catformat-core:${catformat_version}")
    modImplementation(include("com.github.cattyngmd.catformat:catformat-fabric:${catformat_version}"))
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

jar { from(files('LICENSE_oyvey-ported-MIT', 'NOTICE_OYVEY.md')) }
